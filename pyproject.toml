[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xgrid"
version = "0.1.0"
description = "Parse and inspect crossword grids: numbering, word slots, symmetry"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "njones167" }]
dependencies = []

[project.scripts]
xgrid = "xgrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
